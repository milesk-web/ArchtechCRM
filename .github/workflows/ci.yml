name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run costing and workflow regression tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
        env:
          AUTH_SECRET: ci-only-auth-secret-with-at-least-thirty-two-characters
          COSTING_SEED_SECRET: ci-only-seed-secret
          COSTING_ADMIN_EMAILS: admin@example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-only-service-role-key
